<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" width="100" height="70">
  <!-- Pertamina Logo 3 Petals (Blue, Green, Red) -->
  <g transform="translate(18, 5) scale(0.65)">
    <!-- Blue Diamond -->
    <polygon points="50,0 75,25 50,50 25,25" fill="#005BAA"/>
    <!-- Green Diamond -->
    <polygon points="25,25 50,50 25,75 0,50" fill="#78BE20"/>
    <!-- Red Diamond -->
    <polygon points="50,50 75,75 50,100 25,75" fill="#ED1C24"/>
  </g>
  <text x="65" y="24" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF">FASTRON</text>
  <text x="65" y="36" font-family="Arial, sans-serif" font-weight="700" font-size="6.5" fill="#0099FF">PERTAMINA</text>
  <text x="50" y="65" font-family="Arial, sans-serif" font-weight="800" font-size="8" fill="#78BE20" text-anchor="middle" letter-spacing="0.5">SYNTHETIC OIL</text>
</svg>